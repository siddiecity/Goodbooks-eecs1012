<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>GoodBooks Review</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer="true"></script>
</head>

<body>

    <!-- LOGIN PAGE (shown first) -->
    <div id="loginSection">
        <header>
            <!-- Blue overlay + background image -->
            <div class="blueOverlay">
                <img class="background" src="login_background.jpg" alt="Background Image">
            </div>

            <!-- Top header image + logo row (same as original login) -->
            <img class="headerPic" src="books_header.JPG" alt="Blue Books">

            <div class="logo">
                <img class="logoPic" src="booklogo.JPG" alt="Book Logo">
                <h3 id="name">GoodBooks Review</h3>
            </div>
        </header>

        <!-- Centered login box -->
        <div class="loginBox">
            <form id="login-form">
                <h1>Welcome Back!</h1>

                <div class="input">
                    <label for="usernameInput">Username*</label>
                    <input type="text" id="usernameInput" name="username" placeholder="Username" required>
                </div>

                <div class="input">
                    <label for="passwordInput">Password*</label>
                    <input type="password" id="passwordInput" name="password"
                           placeholder="Password"
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                           required>
                </div>

                <div class="button">
                    <button id="loginButton" type="button">Login</button>
                </div>

                <!-- Login error message -->
                <p id="loginMessage" class="message"></p>
                <!-- Login hint (shows after 3 failed attempts) -->
                <p id="loginHint" class="hint"></p>
            </form>
        </div>

        <!-- Bottom colour block (footer stripe) -->
        <footer>
            <div class="colourBlock loginFooterBlock"></div>
        </footer>
    </div>

    <!-- MAIN APP (hidden until login succeeds) -->
    <div id="mainSection" class="hidden">

        <!-- Header (background + logout button) -->
        <header>
            <!-- Logout button in top-right -->
            <button id="logoutButton" class="logout">Sign Out</button>

            <!-- Blue overlay + background image -->
            <div class="blueOverlay">
                <img class="background" src="login_background.jpg" alt="Background Image">
            </div>

            <!-- Top navy bar -->
            <div class="colourBlock mainHeaderBlock"></div>
        </header>

        <div class="page">
            <!-- SIDEBAR (GoodBooks style) -->
            <div class="sidebar">
                <h2>GoodBooks Review</h2>

                <img class="userPhoto" src="userphoto.JPG" alt="User Photo">
                <h3>Syntax_sisters</h3>

                <ul class="sections">
                    <li>
                        <button class="nav-button" data-target="homeSection">Homepage</button>
                    </li>
                    <li>
                        <button class="nav-button" data-target="previousSection">Previous Reviews</button>
                    </li>
                    <li>
                        <button class="nav-button" data-target="searchSection">Search Books</button>
                    </li>
                </ul>
            </div>

            <!-- HOME / WRITE REVIEW SECTION -->
            <main id="homeSection" class="main content-section">
                <div class="ratesBox">
                    <label for="ratingInput">Star Rating:</label>
                    <select id="ratingInput">
                        <option value="">Select rating</option>
                        <option value="1">1 ★</option>
                        <option value="2">2 ★★</option>
                        <option value="3">3 ★★★</option>
                        <option value="4">4 ★★★★</option>
                        <option value="5">5 ★★★★★</option>
                    </select>
                </div>

                <div class="review">
                    <div class="reviewBox">
                        <div class="bookTitle">
                            <input type="text" id="bookTitleInput" name="bookTitle"
                                   placeholder="Book Title" required>
                        </div>

                        <div class="date">
                            <label for="dateCompletedInput">Date Completed: </label>
                            <input type="date" id="dateCompletedInput" name="dateCompleted">
                        </div>

                        <div class="commentBox">
                            <textarea id="reviewTextInput"
                                      placeholder="Enter review here..."></textarea>
                        </div>
                    </div>
                </div>

                <p>
                    <button id="publishButton">Publish</button>
                </p>
                <p id="publishMessage" class="message"></p>
            </main>

            <!-- SEARCH BOOKS SECTION -->
            <main id="searchSection" class="search-section content-section hidden">
                <h1 class="page-title">Search Books</h1>

                <!-- Search form Google Books -->
                <form id="searchForm">
                    <div class="search-box">
                        <input type="text" id="searchInput"
                               placeholder="Search books... ex. Divergent">
                        <button id="searchButton" class="search-btn" type="submit">Search</button>
                    </div>
                </form>

                <!-- Error message / No results -->
                <p id="searchMessage" class="message"></p>

                <!-- Results injected by script.js -->
                <section id="searchResults" class="search-results"></section>
            </main>

            <!-- PREVIOUS REVIEWS SECTION -->
            <main id="previousSection" class="main content-section hidden">
                <h1 class="page-title">Previous Reviews</h1>
                <!-- Cards injected by showSavedReviews() -->
                <div id="reviewsList"></div>
            </main>

        </div> <!-- end .page -->

    </div> <!-- end #mainSection -->

</body>
</html>
